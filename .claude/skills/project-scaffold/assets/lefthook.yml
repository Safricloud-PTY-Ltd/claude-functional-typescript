# Git hooks. `pnpm exec lefthook install` after cloning (the postinstall does it too).
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,js,cjs,json,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
    - name: lint
      glob: '*.{ts,js}'
      # .claude/ ships the template configs in project-scaffold/assets/; ESLint would take that
      # eslint.config.js as the nearest config for those files and fail on its imports.
      exclude:
        - '.claude/**'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    # Whole-project, so it is skipped while the orchestrator has territories live: parallel
    # architects' half-written files would fail each other's commits. They typecheck their
    # own paths, and pre-push runs the full check.
    # No double quotes inside a run: line. On Windows lefthook wraps the whole line in "…"
    # unescaped, so an inner " ends the command early and every commit fails on a syntax error.
    - name: typecheck
      run: if ls .claude/territories/* >/dev/null 2>&1; then echo 'typecheck skipped while territories are live; pre-push runs pnpm check'; else pnpm typecheck; fi

pre-push:
  jobs:
    - name: check
      run: pnpm check
