name: nightly
# Mutation testing (Stryker) runs only when dispatched by hand: it is too slow for the loop and
# too slow for a schedule nobody reads. Run it from the Actions tab or `gh workflow run nightly.yml`.
on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation.html
