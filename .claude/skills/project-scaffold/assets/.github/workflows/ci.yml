name: ci

# A PR stays in draft through its review loop and CI runs once, when it is marked ready
# (ready_for_review). Pushes to a ready PR run it again; pushes to a draft don't.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware ESLint holds the whole program in memory. A project of ~1,700 modules passed
      # Node's default ~2 GB heap on the runner and aborted (exit 134); the runner has 16 GB.
      - run: pnpm check
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm coverage
